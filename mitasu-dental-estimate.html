<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミタス歯科クリニック 見積もりシミュレーター</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif; background: #f7fafc; min-height: 100vh; color: #1e293b; }
  button { font-family: inherit; }

  .header { background: linear-gradient(135deg, #019dc5 0%, #35bcdf 100%); color: #fff; padding: 20px 16px 16px; text-align: center; }
  .header h1 { font-size: 20px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.15); }
  .header p { margin-top: 4px; font-size: 13px; opacity: 0.9; }
  .header img { /* ロゴ元の色をそのまま表示 */ }

  .mode-toggle { display: flex; gap: 0; margin: 8px auto 4px; width: fit-content; background: rgba(255,255,255,0.15); border-radius: 20px; padding: 2px; }
  .mode-btn { padding: 5px 16px; border: none; border-radius: 18px; font-size: 12px; font-weight: 600; cursor: pointer; background: transparent; color: rgba(255,255,255,0.7); font-family: inherit; transition: 0.2s; }
  .mode-btn.active { background: #fff; color: #01799a; }

  .header-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
  .header-actions button { padding: 7px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.15); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .header-actions button:hover { background: rgba(255,255,255,0.25); }

  .tabs { display: flex; background: #fff; border-bottom: 2px solid #e2e8f0; }
  .tab-btn { flex: 1; padding: 12px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; background: #f8fafc; color: #8899a8; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab-btn.active { background: #fff; color: #01799a; border-bottom-color: #019dc5; }

  .content { padding: 16px; max-width: 600px; margin: 0 auto; transition: max-width 0.3s; }
  body.compare-mode .content { max-width: 960px; }

  .total-bar { background: linear-gradient(135deg, #019dc5 0%, #35bcdf 100%); border-radius: 10px; padding: 14px 16px; color: #fff; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .refund-bar { background: linear-gradient(135deg, #e6f6fb 0%, #d0eef7 100%); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; border: 1px solid #7fd0e5; }

  .cat-panel { border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .cat-header { width: 100%; padding: 12px 16px; background: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; }
  .cat-header.open { background: #e6f6fb; }
  .cat-body { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .cat-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: left; transition: 0.15s; }
  .cat-item:hover { background: #e6f6fb; }

  .selected-item { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; border-radius: 8px; padding: 8px 12px; border: 1px solid #e2e8f0; margin-bottom: 6px; }
  .qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .remove-btn { width: 26px; height: 26px; border-radius: 50%; border: none; background: #fee2e2; color: #dc2626; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }

  .card { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e2e8f0; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; padding: 3px 0; }

  .preset-btn { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.15s; border: 1px solid #cbd5e1; background: #fff; color: #475569; }
  .preset-btn.active { border: 2px solid #35bcdf; background: #e6f6fb; color: #01799a; }
  .input-field { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; font-family: inherit; }
  .hidden { display: none; }

  /* 見積書タブ */
  .est-patient-section { background: #fff; border-radius: 10px; padding: 14px; border: 1px solid #e2e8f0; margin-bottom: 12px; }
  .est-patient-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .est-field { display: flex; align-items: center; gap: 4px; font-size: 13px; }
  .est-field label { font-size: 11px; color: #64748b; font-weight: 500; white-space: nowrap; }
  .est-field input { padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-family: inherit; outline: none; }
  .est-name-input { font-size: 16px !important; font-weight: 700 !important; width: 150px; }
  .est-sama { font-size: 16px; font-weight: 700; color: #01799a; }
  .est-memo textarea { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 40px; outline: none; }

  .dc-card { background: #fff; border-radius: 10px; padding: 12px; border: 1px solid #e2e8f0; margin-bottom: 12px; }
  .dc-card h4 { margin: 0 0 2px; font-size: 13px; color: #475569; text-align: center; }
  .dc-hint { font-size: 10px; color: #94a3b8; text-align: center; margin-bottom: 4px; }
  .dc-selected-count { font-size: 11px; color: #01799a; text-align: center; font-weight: 600; margin-top: 4px; }

  /* モーダル */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: #fff; border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .modal-title { font-size: 16px; font-weight: 700; color: #01799a; margin-bottom: 16px; }
  .save-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .save-input-row input { flex: 1; }
  .save-input-row button { padding: 10px 18px; background: #019dc5; color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .save-list-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  .save-list-item:hover { background: #f8fafc; }
  .save-list-item .info { flex: 1; }
  .save-list-item .name { font-size: 13px; font-weight: 600; color: #01799a; }
  .save-list-item .date { font-size: 11px; color: #94a3b8; }
  .save-list-item .detail { font-size: 11px; color: #64748b; margin-top: 2px; }
  .del-save-btn { padding: 4px 10px; border: 1px solid #fca5a5; background: #fef2f2; color: #dc2626; border-radius: 6px; font-size: 11px; cursor: pointer; font-family: inherit; }

  /* 仮設定バッジ */
  .kari-badge { display: inline-block; background: #fef3c7; color: #92400e; font-size: 9px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; font-weight: 600; }

  /* プランカード */
  .plan-cards { display: flex; gap: 8px; margin-bottom: 16px; }
  .plan-card { flex: 1; border-radius: 12px; padding: 14px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; position: relative; }
  .plan-card.active { border-color: #019dc5; box-shadow: 0 2px 12px rgba(0,160,210,0.25); }
  .plan-card-platinum { background: linear-gradient(135deg, #019dc5 0%, #35bcdf 100%); color: #fff; }
  .plan-card-gold { background: linear-gradient(135deg, #e6f6fb 0%, #d0eef7 100%); color: #01799a; border: 1px solid #7fd0e5; }
  .plan-card-silver { background: linear-gradient(135deg, #f8fafb 0%, #edf1f4 100%); color: #3d4f5f; border: 1px solid #c8d8e0; }
  .plan-card-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .plan-card-total { font-size: 18px; font-weight: 700; }
  .plan-card-detail { font-size: 11px; opacity: 0.8; margin-top: 2px; }
  .plan-card-badge { position: absolute; top: -8px; right: 8px; background: #f59e0b; color: #fff; font-size: 9px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }

  /* 比較表 */
  .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
  .compare-table th { background: #e6f6fb; border: 1px solid #cbd5e1; padding: 10px 8px; font-weight: 600; text-align: center; font-size: 12px; color: #01799a; }
  .compare-table td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; color: #1e293b; }
  .compare-table td:first-child { text-align: left; font-weight: 500; }
  .compare-table tr.compare-total td { border-top: 2px solid #019dc5; font-weight: 700; background: #e6f6fb; }
  .compare-table .col-platinum { background: rgba(1,157,197,0.08); }
  .compare-table .col-gold { background: rgba(53,188,223,0.06); }
  .compare-table .col-silver { background: rgba(200,216,224,0.06); }

  /* ===== 印刷専用 ===== */
  #print-estimate { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 25mm 20mm; }
    body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 11px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .header, .tabs, .content, #modal-root { display: none !important; }
    #print-estimate { display: block !important; padding: 4mm 0; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS PMincho', serif; color: #1a1a1a; min-width: 700px; }
    .pe-title { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 6px; margin-bottom: 6px; border-bottom: 3px double #1a1a1a; padding-bottom: 10px; }
    .pe-subtitle { text-align: center; font-size: 11px; color: #666; margin-bottom: 14px; }
    .pe-meta { display: flex; justify-content: space-between; margin-bottom: 14px; align-items: flex-end; }
    .pe-patient { font-size: 18px; font-weight: 700; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; min-width: 200px; }
    .pe-info-right { text-align: right; font-size: 11px; line-height: 1.8; }
    .pe-info-right span { border-bottom: 1px solid #ccc; padding-bottom: 1px; }
    .pe-total-box { background: #e6f6fb; border: 2px solid #019dc5; border-radius: 6px; padding: 10px 16px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .pe-total-label { font-size: 13px; font-weight: 600; }
    .pe-total-amount { font-size: 22px; font-weight: 700; color: #01799a; }
    .pe-body { display: flex; gap: 16px; margin-bottom: 10px; }
    .pe-chart-col { flex: 0 0 180px; }
    .pe-table-col { flex: 1; }
    .pe-chart-title { font-size: 10px; font-weight: 600; text-align: center; margin-bottom: 4px; color: #475569; }
    .pe-table { width: 100%; border-collapse: collapse; font-size: 10px; }
    .pe-table th { background: #e6f6fb; border: 1px solid #94a3b8; padding: 5px 6px; font-weight: 600; text-align: center; font-size: 10px; }
    .pe-table td { border: 1px solid #cbd5e1; padding: 4px 6px; }
    .pe-table td.num { text-align: right; white-space: nowrap; }
    .pe-table td.center { text-align: center; }
    .pe-table tr.empty-row td { height: 20px; }
    .pe-table tr.sum-row td { border-top: 2px solid #1a1a1a; font-weight: 700; background: #f8fafc; }
    .pe-table tr.total-row td { border-top: 2px solid #019dc5; font-weight: 700; font-size: 12px; background: #e6f6fb; }
    .pe-memo { border: 1px solid #e2e8f0; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; min-height: 30px; font-size: 10px; line-height: 1.5; }
    .pe-memo-label { font-size: 9px; color: #64748b; margin-bottom: 2px; }
    .pe-notes { font-size: 9px; color: #94a3b8; line-height: 1.6; }
    .pe-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; padding-top: 6px; border-top: 1px solid #e2e8f0; font-size: 9px; color: #94a3b8; }
    /* 印刷用比較表 */
    .pe-compare-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-bottom: 10px; }
    .pe-compare-table th { background: #e6f6fb; border: 1px solid #94a3b8; padding: 5px 6px; font-weight: 600; text-align: center; font-size: 10px; }
    .pe-compare-table td { border: 1px solid #cbd5e1; padding: 4px 6px; text-align: center; }
    .pe-compare-table td:first-child { text-align: left; }
    .pe-compare-table tr.compare-total td { border-top: 2px solid #019dc5; font-weight: 700; background: #e6f6fb; }
    .pe-deduction { border: 1px solid #86efac; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; background: #f0fdf4; }
    .pe-deduction h3 { font-size: 11px; font-weight: 700; color: #166534; margin-bottom: 6px; border-bottom: 1px solid #bbf7d0; padding-bottom: 3px; }
    .pe-ded-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; font-size: 10px; }
    .pe-ded-row { display: flex; justify-content: space-between; }
    .pe-ded-highlight { font-size: 13px; font-weight: 700; color: #059669; text-align: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid #86efac; }
    .pe-net-box { background: #fffbeb; border: 1.5px solid #f59e0b; border-radius: 6px; padding: 8px 12px; text-align: center; margin-bottom: 8px; }
    .pe-net-label { font-size: 10px; color: #92400e; }
    .pe-net-amount { font-size: 18px; font-weight: 700; color: #92400e; }
  }
</style>
</head>

let mode = 'simple'; // 'simple' or 'compare'
let activePlan = 'platinum';
const PLANS = [
  { id: 'platinum', label: 'プラチナプラン', icon: '💎' },
  { id: 'gold', label: 'ゴールドプラン', icon: '🥇' },
  { id: 'silver', label: 'シルバープラン', icon: '🥈' },
];
let planItems = { platinum: [], gold: [], silver: [] };
let planTeethMap = { platinum: {}, gold: {}, silver: {} };
let planSelectedTeeth = { platinum: new Set(), gold: new Set(), silver: new Set() };
let planMemos = { platinum: '', gold: '', silver: '' };

let currentTab = 'estimate';

// ===== Helper accessors =====
function currentItems() { return mode === 'compare' ? planItems[activePlan] : selectedItems; }
function currentTeethMap() { return mode === 'compare' ? planTeethMap[activePlan] : itemTeethMap; }
function currentSelectedTeeth() { return mode === 'compare' ? planSelectedTeeth[activePlan] : selectedTeeth; }
function currentMemo() { return mode === 'compare' ? (planMemos[activePlan] || '') : memo; }
function setCurrentItems(v) { if (mode === 'compare') planItems[activePlan] = v; else selectedItems = v; }
function setCurrentTeethMap(v) { if (mode === 'compare') planTeethMap[activePlan] = v; else itemTeethMap = v; }
function setCurrentSelectedTeeth(v) { if (mode === 'compare') planSelectedTeeth[activePlan] = v; else selectedTeeth = v; }

// ===== 歯式図データ =====
const Q_COLORS = {UR:'#16a34a', UL:'#dc2626', LR:'#7c3aed', LL:'#0f766e'};
const Q_LABELS = {UR:'上顎右側', UL:'上顎左側', LR:'下顎右側', LL:'下顎左側'};
const TEETH_IDS = [];
['UR','UL','LR','LL'].forEach(q => { for(let n=1;n<=7;n++) TEETH_IDS.push(q+n); });

function toggleTooth(id) {
  const teeth = currentSelectedTeeth();
  const tMap = currentTeethMap();
  if (teeth.has(id)) {
    teeth.delete(id);
    Object.keys(tMap).forEach(k => {
      tMap[k] = tMap[k].filter(t => t !== id);
      if (tMap[k].length === 0) delete tMap[k];
    });
    activeTooth = null;
  } else {
    teeth.add(id);
    activeTooth = id;
  }
  render();
}
function linkToothToItem(toothId, itemId) {
  const tMap = currentTeethMap();
  if (!tMap[itemId]) tMap[itemId] = [];
  const arr = tMap[itemId];
  const idx = arr.indexOf(toothId);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(toothId);
  if (arr.length === 0) delete tMap[itemId];
  render();
}
function getTeethForItem(itemId) { return currentTeethMap()[itemId] || []; }
function closeToothPanel() { activeTooth = null; render(); }
function toothLabel(id) {
  const q = id.substring(0,2);
  const n = id.substring(2);
  const names = {UR:'右上',UL:'左上',LR:'右下',LL:'左下'};
  return (names[q]||q) + n;
}

function buildDentalChart(forPrint) {
  const teeth = forPrint ? (mode === 'compare' ? planSelectedTeeth[activePlan] : selectedTeeth) : currentSelectedTeeth();
  const tMap = forPrint ? (mode === 'compare' ? planTeethMap[activePlan] : itemTeethMap) : currentTeethMap();
  const fs = forPrint ? 13 : 18;
  const gap = forPrint ? 2 : 4;
  const pad = forPrint ? '4px 6px' : '6px 10px';
  const selBg = '#fef3c7'; const selBorder = '#f59e0b';
  const linkBg = '#d0eef7'; const linkBorder = '#019dc5';

  let s = `<div style="display:inline-block;margin:0 auto;font-family:sans-serif">`;

  if (!forPrint) {
    s += `<div style="display:flex;justify-content:space-between;margin-bottom:2px">`;
    s += `<span style="font-size:10px;color:${Q_COLORS.UR};font-weight:700">${Q_LABELS.UR}</span>`;
    s += `<span style="font-size:10px;color:${Q_COLORS.UL};font-weight:700">${Q_LABELS.UL}</span></div>`;
  }

  // 上顎右 7→1 | 上顎左 1→7
  s += `<div style="display:flex;align-items:center;gap:0">`;
  s += `<div style="display:flex;gap:${gap}px">`;
  for (let n=7; n>=1; n--) {
    const id = 'UR'+n;
    const sel = teeth.has(id);
    const hasLink = Object.values(tMap).some(a => a.includes(id));
    const bg = sel ? (hasLink ? linkBg : selBg) : 'transparent';
    const bd = sel ? (hasLink ? '2px solid '+linkBorder : '2px solid '+selBorder) : '2px solid transparent';
    if (forPrint) {
      s += `<span style="padding:${pad};font-size:${fs}px;font-weight:700;color:${sel?'#fff':Q_COLORS.UR};background:${sel?(hasLink?linkBorder:Q_COLORS.UR):'transparent'};border:1px solid #333;border-radius:3px;min-width:14px;text-align:center">${n}</span>`;
    } else {
      s += `<span onclick="toggleTooth('${id}')" style="cursor:pointer;padding:${pad};font-size:${fs}px;font-weight:700;color:${Q_COLORS.UR};background:${bg};border:${bd};border-radius:4px;min-width:22px;text-align:center;user-select:none">${n}</span>`;
    }
  }
  s += `</div>`;
  s += `<div style="width:2px;background:#444;align-self:stretch;margin:0 ${gap}px"></div>`;
  s += `<div style="display:flex;gap:${gap}px">`;
  for (let n=1; n<=7; n++) {
    const id = 'UL'+n;
    const sel = teeth.has(id);
    const hasLink = Object.values(tMap).some(a => a.includes(id));
    const bg = sel ? (hasLink ? linkBg : selBg) : 'transparent';
    const bd = sel ? (hasLink ? '2px solid '+linkBorder : '2px solid '+selBorder) : '2px solid transparent';
    if (forPrint) {
      s += `<span style="padding:${pad};font-size:${fs}px;font-weight:700;color:${sel?'#fff':Q_COLORS.UL};background:${sel?(hasLink?linkBorder:Q_COLORS.UL):'transparent'};border:1px solid #333;border-radius:3px;min-width:14px;text-align:center">${n}</span>`;
    } else {
      s += `<span onclick="toggleTooth('${id}')" style="cursor:pointer;padding:${pad};font-size:${fs}px;font-weight:700;color:${Q_COLORS.UL};background:${bg};border:${bd};border-radius:4px;min-width:22px;text-align:center;user-select:none">${n}</span>`;
    }
  }
  s += `</div></div>`;

  s += `<div style="height:2px;background:#444;margin:${gap}px 0"></div>`;

  // 下顎右 7→1 | 下顎左 1→7
  s += `<div style="display:flex;align-items:center;gap:0">`;
  s += `<div style="display:flex;gap:${gap}px">`;
  for (let n=7; n>=1; n--) {
    const id = 'LR'+n;
    const sel = teeth.has(id);
    const hasLink = Object.values(tMap).some(a => a.includes(id));
    const bg = sel ? (hasLink ? linkBg : selBg) : 'transparent';
    const bd = sel ? (hasLink ? '2px solid '+linkBorder : '2px solid '+selBorder) : '2px solid transparent';
    if (forPrint) {
      s += `<span style="padding:${pad};font-size:${fs}px;font-weight:700;color:${sel?'#fff':Q_COLORS.LR};background:${sel?(hasLink?linkBorder:Q_COLORS.LR):'transparent'};border:1px solid #333;border-radius:3px;min-width:14px;text-align:center">${n}</span>`;
    } else {
      s += `<span onclick="toggleTooth('${id}')" style="cursor:pointer;padding:${pad};font-size:${fs}px;font-weight:700;color:${Q_COLORS.LR};background:${bg};border:${bd};border-radius:4px;min-width:22px;text-align:center;user-select:none">${n}</span>`;
    }
  }
  s += `</div>`;
  s += `<div style="width:2px;background:#444;align-self:stretch;margin:0 ${gap}px"></div>`;
  s += `<div style="display:flex;gap:${gap}px">`;
  for (let n=1; n<=7; n++) {
    const id = 'LL'+n;
    const sel = teeth.has(id);
    const hasLink = Object.values(tMap).some(a => a.includes(id));
    const bg = sel ? (hasLink ? linkBg : selBg) : 'transparent';
    const bd = sel ? (hasLink ? '2px solid '+linkBorder : '2px solid '+selBorder) : '2px solid transparent';
    if (forPrint) {
      s += `<span style="padding:${pad};font-size:${fs}px;font-weight:700;color:${sel?'#fff':Q_COLORS.LL};background:${sel?(hasLink?linkBorder:Q_COLORS.LL):'transparent'};border:1px solid #333;border-radius:3px;min-width:14px;text-align:center">${n}</span>`;
    } else {
      s += `<span onclick="toggleTooth('${id}')" style="cursor:pointer;padding:${pad};font-size:${fs}px;font-weight:700;color:${Q_COLORS.LL};background:${bg};border:${bd};border-radius:4px;min-width:22px;text-align:center;user-select:none">${n}</span>`;

    s += `<span style="font-size:10px;color:${Q_COLORS.LL};font-weight:700">${Q_LABELS.LL}</span></div>`;
  }

  s += `</div>`;
  return s;
}

// ===== 計算関数 =====
function getTaxRate(taxableIncome) {
  for (const b of TAX_BRACKETS) { if (taxableIncome >= b.min && taxableIncome < b.max) return b.rate; }
  return 0.45;
}
function getSalaryDeduction(income) {
  if (income <= 1625000) return 550000;
  if (income <= 1800000) return income * 0.4 - 100000;
  if (income <= 3600000) return income * 0.3 + 80000;
  if (income <= 6600000) return income * 0.2 + 440000;
  if (income <= 8500000) return income * 0.1 + 1100000;
  return 1950000;
}
function calcRefund(totalWithTax, otherMed, reimbursement, income) {
  const total = totalWithTax + otherMed;
  const net = Math.max(0, total - reimbursement);
  const taxable = Math.max(0, income - getSalaryDeduction(income) - 480000);
  const threshold = Math.min(Math.floor(taxable * 0.05), 100000);
  const ded = Math.min(Math.max(0, net - threshold), 2000000);
  const rate = getTaxRate(taxable);
  const incomeTax = Math.floor(ded * rate);
  const residentTax = Math.floor(ded * 0.10);
  return { cappedDeduction: ded, rate, incomeTax, residentTax, totalRefund: incomeTax + residentTax, taxable, threshold };
}
function getTotals() {
  const items = currentItems();
  let total = 0, count = 0;
  for (const item of items) { total += item.price * item.qty; count += item.qty; }
  return { total, count };
}
function getPlanTotal(planId) {
  let total = 0, count = 0;
  for (const item of planItems[planId]) { total += item.price * item.qty; count += item.qty; }
  return { total, count };
}

// ===== Mode switching =====
function setMode(m) {
  if (m === mode) return;
  if (m === 'compare' && mode === 'simple') {
    planItems.platinum = JSON.parse(JSON.stringify(selectedItems));
    planTeethMap.platinum = JSON.parse(JSON.stringify(itemTeethMap));
    planSelectedTeeth.platinum = new Set(selectedTeeth);
    planMemos.platinum = memo;
    if (planItems.gold.length === 0) planItems.gold = [];
    if (planItems.silver.length === 0) planItems.silver = [];
  } else if (m === 'simple' && mode === 'compare') {
    const src = planItems[activePlan].length > 0 ? activePlan : 'platinum';
    if (planItems[src].length > 0) {
      selectedItems = JSON.parse(JSON.stringify(planItems[src]));
      itemTeethMap = JSON.parse(JSON.stringify(planTeethMap[src]));
      selectedTeeth = new Set(planSelectedTeeth[src]);
      memo = planMemos[src] || '';
    }
  }
  mode = m;
  document.body.classList.toggle('compare-mode', m === 'compare');
  document.getElementById('mode-simple').classList.toggle('active', m === 'simple');
  document.getElementById('mode-compare').classList.toggle('active', m === 'compare');
  activeTooth = null;
  switchTab('estimate');
  render();
}

function switchPlan(planId) {
  activeTooth = null;
  activePlan = planId;
  render();
}

// ===== 項目操作 =====
function addItem(catIdx, itemIdx) {
  const item = CATEGORIES[catIdx].items[itemIdx];
  const items = currentItems();
  const exists = items.find(i => i.id === item.id);
  if (exists) exists.qty++; else items.push({ ...item, qty: 1 });
  render();
}
function removeItem(id) {
  const items = currentItems();
  const tMap = currentTeethMap();
  const filtered = items.filter(i => i.id !== id);
  setCurrentItems(filtered);
  delete tMap[id];
  render();
}
function clearAllItems() {
  if (!confirm('選択した項目をすべてクリアしますか？')) return;
  setCurrentItems([]);
  if (mode === 'compare') {
    planTeethMap[activePlan] = {};
    planSelectedTeeth[activePlan] = new Set();
  } else {
    itemTeethMap = {};
    selectedTeeth.clear();
  }
  activeTooth = null;
  render();
  showToast('クリアしました');
}
function resetAll() {
  if (!confirm('患者情報・選択項目・すべてのプランをリセットしますか？（保存済みデータは消えません）')) return;
  selectedItems = [];
  selectedTeeth = new Set();
  itemTeethMap = {};
  patientName = ''; doctorName = '';
  planDate = new Date().toISOString().slice(0, 10);
  memo = '';
  annualIncome = 7000000; otherMedical = 0; insuranceReimbursement = 0;
  customCounter = 0; activeTooth = null; openCategories = {};
  planItems = { platinum: [], gold: [], silver: [] };
  planTeethMap = { platinum: {}, gold: {}, silver: {} };
  planSelectedTeeth = { platinum: new Set(), gold: new Set(), silver: new Set() };
  planMemos = { platinum: '', gold: '', silver: '' };
  activePlan = 'platinum';
  mode = 'simple';
  document.body.classList.remove('compare-mode');
  document.getElementById('mode-simple').classList.add('active');
  document.getElementById('mode-compare').classList.remove('active');
  switchTab('estimate');
  render();
  showToast('リセットしました');
}
function changeQty(id, delta) {
  const items = currentItems();
  const item = items.find(i => i.id === id);
  if (item) item.qty = Math.max(0, item.qty + delta);
  const remaining = items.filter(i => i.qty > 0);
  if (!remaining.find(i => i.id === id)) {
    const tMap = currentTeethMap();
    delete tMap[id];
  }
  setCurrentItems(remaining);
  render();
}
function addCustom() {
  const nameEl = document.getElementById('custom-name');
  const priceEl = document.getElementById('custom-price');
  const name = nameEl.value.trim();
  const price = parseInt(priceEl.value) || 0;
  if (!name) return;
  customCounter++;
  const items = currentItems();
  items.push({ id: 'custom_' + customCounter, name, price, qty: 1, custom: true });
  nameEl.value = ''; priceEl.value = '';
  render();
}

function setDoctor(v) { doctorName = v; }
function setPlanDate(v) { planDate = v; }

    annualIncome, otherMedical, insuranceReimbursement, customCounter,

      silver: JSON.parse(JSON.stringify(planItems.silver)),

      gold: JSON.parse(JSON.stringify(planTeethMap.gold)),
      silver: JSON.parse(JSON.stringify(planTeethMap.silver)),

    planSelectedTeeth: {
      platinum: Array.from(planSelectedTeeth.platinum),
      gold: Array.from(planSelectedTeeth.gold),
      silver: Array.from(planSelectedTeeth.silver),
    },
    planMemos: { ...planMemos },

}
function loadState(s) {
  patientName = s.patientName || ''; doctorName = s.doctorName || '';
  planDate = s.planDate || new Date().toISOString().slice(0, 10);
  memo = s.memo || ''; selectedItems = s.selectedItems || [];
  annualIncome = s.annualIncome || 7000000; otherMedical = s.otherMedical || 0;
  insuranceReimbursement = s.insuranceReimbursement || 0;
  customCounter = s.customCounter || 0;
  selectedTeeth = new Set(s.selectedTeeth || []);
  itemTeethMap = s.itemTeethMap || {};
  activeTooth = null;
  openCategories = {};
  mode = s.mode || 'simple';
  activePlan = s.activePlan || 'platinum';
  if (s.planItems) {
    planItems.platinum = s.planItems.platinum || [];
    planItems.gold = s.planItems.gold || [];
    planItems.silver = s.planItems.silver || [];
  } else {
    planItems = { platinum: [], gold: [], silver: [] };
  }
  if (s.planTeethMap) {
    planTeethMap.platinum = s.planTeethMap.platinum || {};
    planTeethMap.gold = s.planTeethMap.gold || {};
    planTeethMap.silver = s.planTeethMap.silver || {};
  } else {
    planTeethMap = { platinum: {}, gold: {}, silver: {} };
  }
  if (s.planSelectedTeeth) {
    planSelectedTeeth.platinum = new Set(s.planSelectedTeeth.platinum || []);
    planSelectedTeeth.gold = new Set(s.planSelectedTeeth.gold || []);
    planSelectedTeeth.silver = new Set(s.planSelectedTeeth.silver || []);
  } else {
    planSelectedTeeth = { platinum: new Set(), gold: new Set(), silver: new Set() };
  }
  planMemos = s.planMemos || { platinum: '', gold: '', silver: '' };
  document.body.classList.toggle('compare-mode', mode === 'compare');
  document.getElementById('mode-simple').classList.toggle('active', mode === 'simple');
  document.getElementById('mode-compare').classList.toggle('active', mode === 'compare');
  switchTab('estimate');
  render();
}

// ===== 保存/読込 =====
function getSavedList() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; } }
function setSavedList(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

function showSaveModal() {
  const name = patientName ? (patientName + '様') : '新規見積もり';
  const defName = name + ' ' + planDate;
  let h = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">
    <div class="modal-title">💾 見積もりを保存</div>
    <div class="save-input-row"><input id="save-name" class="input-field" value="${esc(defName)}" placeholder="保存名を入力"><button onclick="doSave()">保存</button></div>`;
  const list = getSavedList();
  if (list.length > 0) {
    h += '<div style="font-size:12px;color:#64748b;margin-bottom:8px">既存データをクリックで上書き</div>';
    list.forEach((s, i) => {
      h += `<div class="save-list-item" onclick="document.getElementById('save-name').value='${esc(s.name).replace(/'/g, "\\'")}'" style="cursor:pointer">
        <div class="info"><div class="name">${esc(s.name)}</div><div class="date">${esc(s.savedAt)}</div></div></div>`;
    });
  }
  h += '</div></div>';
  document.getElementById('modal-root').innerHTML = h;
}
function doSave() {
  const nameEl = document.getElementById('save-name');
  const name = nameEl.value.trim();
  if (!name) { alert('保存名を入力してください'); return; }
  const list = getSavedList();
  const entry = { name, savedAt: new Date().toLocaleString('ja-JP'), data: getState() };
  const existing = list.findIndex(s => s.name === name);
  if (existing >= 0) list[existing] = entry; else list.unshift(entry);
  setSavedList(list); closeModal(); showToast('保存しました');
}
function showLoadModal() {
  const list = getSavedList();
  let h = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box">
    <div class="modal-title">📂 保存した見積もりを読み込む</div>`;
  if (list.length === 0) {
    h += '<div style="text-align:center;padding:30px;color:#94a3b8"><div style="font-size:32px;margin-bottom:8px">📭</div><div style="font-size:13px">保存データなし</div></div>';
  } else {
    list.forEach((s, i) => {
      h += `<div class="save-list-item"><div class="info" onclick="doLoad(${i})" style="cursor:pointer">
        <div class="name">${esc(s.name)}</div><div class="date">${esc(s.savedAt)}</div>
      </div><button class="del-save-btn" onclick="event.stopPropagation();doDelete(${i})">削除</button></div>`;
    });
  }
  h += '</div></div>';
  document.getElementById('modal-root').innerHTML = h;
}
function doLoad(idx) { const list = getSavedList(); if (list[idx]) { loadState(list[idx].data); closeModal(); showToast('読み込みました'); } }
function doDelete(idx) { if (!confirm('削除しますか？')) return; const list = getSavedList(); list.splice(idx, 1); setSavedList(list); showLoadModal(); }
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

// ===== タブ切替 =====
function switchTab(tab) {
  currentTab = tab;
  const allTabs = ['estimate', 'quote', 'deduction'];
  allTabs.forEach(t => {
    const page = document.getElementById('page-' + t);
    if (page) page.classList.toggle('hidden', tab !== t);
  });
  renderTabs();
}

function renderTabs() {
  let h = '';
  if (mode === 'simple') {
    const tabs = [
      { id: 'estimate', label: '補綴を選ぶ' },
      { id: 'quote', label: '見積書' },
      { id: 'deduction', label: '医療費控除' },
    ];
    tabs.forEach(t => {
      h += `<button class="tab-btn ${currentTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')" id="tab-${t.id}">${t.label}</button>`;
    });
  } else {
    const tabs = [
      { id: 'estimate', label: 'プラン編集・比較' },
      { id: 'quote', label: '見積書' },
      { id: 'deduction', label: '医療費控除' },
    ];
    tabs.forEach(t => {
      h += `<button class="tab-btn ${currentTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')" id="tab-${t.id}">${t.label}</button>`;
    });
  }
  document.getElementById('tabs-container').innerHTML = h;
}

// ===== Plan cards for compare mode =====
function buildPlanCards() {
  let h = '<div class="plan-cards">';
  PLANS.forEach(plan => {
    const { total, count } = getPlanTotal(plan.id);
    const refund = calcRefund(total, otherMedical, insuranceReimbursement, annualIncome);
    const isActive = activePlan === plan.id;
    h += `<div class="plan-card plan-card-${plan.id} ${isActive ? 'active' : ''}" onclick="switchPlan('${plan.id}')">`;
    if (isActive) h += `<div class="plan-card-badge">編集中</div>`;
    h += `<div class="plan-card-name">${plan.icon} ${plan.label}</div>`;
    h += `<div class="plan-card-total">¥${fmt(total)}</div>`;
    if (total > 0 && refund.totalRefund > 0) {
      h += `<div class="plan-card-detail">還付: -¥${fmt(refund.totalRefund)}</div>`;
      h += `<div class="plan-card-detail">実質: ¥${fmt(total - refund.totalRefund)}</div>`;
    }
    h += `<div class="plan-card-detail">${count}箇所</div>`;
    h += `</div>`;
  });
  h += '</div>';
  return h;
}

// ===== 比較表 =====
function buildCompareTable() {
  const allItemIds = new Map();
  PLANS.forEach(plan => {
    planItems[plan.id].forEach(item => {
      allItemIds.set(item.id, item.name);
    });
  });

  let h = '<table class="compare-table">';
  h += '<thead><tr><th style="text-align:left">内容</th>';
  PLANS.forEach(plan => {
    h += `<th class="col-${plan.id}">${plan.icon} ${plan.label}</th>`;
  });
  h += '</tr></thead><tbody>';

  allItemIds.forEach((name, id) => {
    h += '<tr>';
    h += `<td>${esc(name)}</td>`;
    PLANS.forEach(plan => {
      const item = planItems[plan.id].find(i => i.id === id);
      if (item) {
        h += `<td class="col-${plan.id}" style="color:#01799a;font-weight:600">✓ ×${item.qty}<br><span style="font-size:10px;color:#64748b">¥${fmt(item.price * item.qty)}</span></td>`;
      } else {
        h += `<td class="col-${plan.id}" style="color:#cbd5e1">—</td>`;
      }
    });
    h += '</tr>';
  });

  if (allItemIds.size === 0) {
    h += `<tr><td colspan="4" style="text-align:center;padding:20px;color:#94a3b8">プランに項目を追加してください</td></tr>`;
  }

  h += '<tr class="compare-total"><td style="font-weight:700">合計（税込）</td>';
  PLANS.forEach(plan => {
    const { total } = getPlanTotal(plan.id);
    h += `<td class="col-${plan.id}" style="font-weight:700;color:#01799a">¥${fmt(total)}</td>`;
  });
  h += '</tr>';

  h += '<tr><td>還付目安</td>';
  PLANS.forEach(plan => {
    const { total } = getPlanTotal(plan.id);
    const refund = calcRefund(total, otherMedical, insuranceReimbursement, annualIncome);
    h += `<td class="col-${plan.id}" style="color:#e67e22;font-weight:600">${total > 0 ? '-¥' + fmt(refund.totalRefund) : '—'}</td>`;
  });
  h += '</tr>';

  h += '<tr><td>実質負担額</td>';
  PLANS.forEach(plan => {
    const { total } = getPlanTotal(plan.id);
    const refund = calcRefund(total, otherMedical, insuranceReimbursement, annualIncome);
    h += `<td class="col-${plan.id}" style="font-weight:700;color:#92400e">${total > 0 ? '¥' + fmt(total - refund.totalRefund) : '—'}</td>`;
  });
  h += '</tr>';

  h += '</tbody></table>';
  return h;
}

      <div class="row"><span>推定課税所得</span><span>¥${fmt(refund.taxable)}</span></div>
      <div class="row"><span>所得税率</span><span style="font-weight:600;color:#7c3aed">${(refund.rate * 100).toFixed(0)}%</span></div>
      <div class="row" style="margin-top:6px"><span>所得税の還付目安</span><span style="font-weight:600;color:#e67e22">¥${fmt(refund.incomeTax)}</span></div>
      <div class="row"><span>住民税の軽減目安</span><span style="font-weight:600;color:#e67e22">¥${fmt(refund.residentTax)}</span></div>
      <div class="row" style="border-top:2px solid #e67e22;padding-top:8px;margin-top:6px"><span style="font-weight:700;font-size:15px;color:#e67e22">合計還付・軽減目安</span><span style="font-weight:700;font-size:18px;color:#e67e22">¥${fmt(refund.totalRefund)}</span></div>
    </div></div>`;

  if (total > 0 && refund.totalRefund > 0) {
    ded += `<div style="background:linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);border-radius:10px;padding:16px;border:1px solid #f59e0b;text-align:center;margin-bottom:12px">
      <div style="font-size:13px;color:#92400e;margin-bottom:4px">医療費控除後の実質負担額</div>
      <div style="font-size:24px;font-weight:700;color:#92400e">¥${fmt(total - refund.totalRefund)}</div>
      <div style="font-size:11px;color:#b45309;margin-top:4px">自費診療費 ¥${fmt(total)} − 還付等 ¥${fmt(refund.totalRefund)}</div>
    </div>`;
  }

  if (items.length > 0) {
    ded += `<div class="card"><h4 style="margin:0 0 10px;font-size:14px;color:#475569">選択した治療内容</h4><div style="display:flex;flex-direction:column;gap:2px;font-size:13px">`;
    items.forEach(item => {
      const badge = item.custom ? '<span style="background:#fef3c7;color:#92400e;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px">自由入力</span>' : '';
      ded += `<div class="row" style="padding:6px 0;border-bottom:1px solid #f1f5f9"><span style="flex:1">${esc(item.name)}${badge}${item.qty > 1 ? ' <span style="color:#64748b">×' + item.qty + '</span>' : ''}</span><span style="font-weight:600;flex-shrink:0">¥${fmt(item.price * item.qty)}</span></div>`;
    });
    ded += `<div class="row" style="padding-top:8px;margin-top:4px;border-top:2px solid #e2e8f0"><span style="font-weight:700;color:#01799a">合計</span><span style="font-weight:700;color:#01799a">¥${fmt(total)}</span></div></div></div>`;
  }

  ded += `<div style="font-size:11px;color:#94a3b8;line-height:1.6">
    ※ 上記は概算です。実際の金額は個人の状況により異なります。<br>
    ※ 給与所得控除・基礎控除のみ考慮した簡易計算です。<br>
    ※ 年収は仮設定です。正確な還付額は税理士等にご相談ください。<br>
    ※ 医療費控除の上限は200万円です。</div>`;

  document.getElementById('page-deduction').innerHTML = ded;

  // ===== 印刷用見積書 =====
  if (mode === 'compare') {
    renderPrintViewCompare();
  } else {
    renderPrintView(total, count, refund);
  }
}

function renderPrintView(total, count, refund) {
  const dateStr = planDate ? planDate.replace(/-/g, '/').replace(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/, (m,y,mo,d) => `${y}年${parseInt(mo)}月${parseInt(d)}日`) : '';
  const taxExcl = Math.round(total / 1.1);
  const tax = total - taxExcl;

  let chart = `<div style="text-align:center"><div class="pe-chart-title">歯 式 図</div>${buildDentalChart(true)}</div>`;

  let rows = '';
  selectedItems.forEach(item => {
    const teeth = (itemTeethMap[item.id] || []);
    const teethStr = teeth.length > 0 ? `<div style="font-size:8px;color:#01799a">${teeth.map(t=>toothLabel(t)).join(', ')}</div>` : '';
    rows += `<tr><td>${esc(item.name)}${item.custom ? ' <span style="font-size:8px;color:#92400e">[自由]</span>' : ''}${teethStr}</td>
      <td class="center">${item.qty}</td><td class="num">¥${fmt(item.price)}</td><td class="num">¥${fmt(item.price * item.qty)}</td></tr>`;
  });
  for (let i = selectedItems.length; i < 8; i++) rows += '<tr class="empty-row"><td></td><td></td><td></td><td></td></tr>';

  let pe = '';
  pe += `<div style="text-align:center;margin-bottom:8px"><img src="${CLINIC_LOGO}" style="height:40px" alt="ミタス歯科クリニック"></div>`;
  pe += `<div class="pe-meta">
    <div><div class="pe-patient">${patientName ? esc(patientName) + ' 様' : '　　　　　　　　 様'}</div></div>
    <div class="pe-info-right">
      <div>作成日: <span>${dateStr || '　　年　　月　　日'}</span></div>
      <div>担当医: <span>${doctorName ? esc(doctorName) : '　　　　　　'}</span></div>
    </div></div>`;

  pe += `<div class="pe-total-box"><div class="pe-total-label">お見積り合計金額（税込）</div><div class="pe-total-amount">¥${fmt(total)}</div></div>`;

  pe += `<div class="pe-body"><div class="pe-chart-col">${chart}</div>
    <div class="pe-table-col"><table class="pe-table">
      <thead><tr><th style="width:auto">内容</th><th style="width:36px">数量</th><th style="width:72px">金額</th><th style="width:80px">小計</th></tr></thead>
      <tbody>${rows}
        <tr class="sum-row"><td colspan="3" style="text-align:right">税抜き合計</td><td class="num">¥${fmt(taxExcl)}</td></tr>
        <tr class="sum-row"><td colspan="3" style="text-align:right">消費税（10%）</td><td class="num">¥${fmt(tax)}</td></tr>
        <tr class="total-row"><td colspan="3" style="text-align:right">税込み合計</td><td class="num">¥${fmt(total)}</td></tr>
      </tbody></table></div></div>`;

  if (total > 0 && refund.totalRefund > 0) {
    pe += `<div class="pe-deduction"><h3>医療費控除シミュレーション（参考・年収は仮設定）</h3>
      <div class="pe-ded-grid">
        <div class="pe-ded-row"><span>年収設定</span><span>${fmt(annualIncome/10000)}万円（仮）</span></div>
        <div class="pe-ded-row"><span>所得税率</span><span>${(refund.rate*100).toFixed(0)}%</span></div>
        <div class="pe-ded-row"><span>医療費控除額</span><span>¥${fmt(refund.cappedDeduction)}</span></div>
        <div class="pe-ded-row"><span>所得税還付</span><span style="font-weight:700;color:#059669">¥${fmt(refund.incomeTax)}</span></div>
        <div class="pe-ded-row"><span>住民税軽減</span><span style="font-weight:700;color:#059669">¥${fmt(refund.residentTax)}</span></div>
      </div>
      <div class="pe-ded-highlight">合計還付・軽減目安: ¥${fmt(refund.totalRefund)}</div></div>`;
    pe += `<div class="pe-net-box"><div class="pe-net-label">医療費控除後の実質負担額（参考）</div><div class="pe-net-amount">¥${fmt(total - refund.totalRefund)}</div></div>`;
  }

  if (memo) pe += `<div><div class="pe-memo-label">備考</div><div class="pe-memo">${esc(memo).replace(/\n/g,'<br>')}</div></div>`;

  pe += `<div class="pe-notes">※ 表示価格はすべて税込です。医療費控除は簡易シミュレーションであり、実際の還付額は年収等により異なります。<br>
    ※ 本見積は現時点での診断に基づいて作成しております。治療の進行状況やお口の状態の変化により、治療内容および費用が変更となる場合がございます。<br>
    ※ 追加処置が必要となった場合は別途費用が発生することがあります。</div>`;
  pe += `<div class="pe-footer"><div>有効期限: 発行日より3ヶ月</div><div style="text-align:right">ミタス歯科クリニック　TEL 048-822-8500</div></div>`;

  document.getElementById('print-estimate').innerHTML = pe;
}

function renderPrintViewCompare() {
  const dateStr = planDate ? planDate.replace(/-/g, '/').replace(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/, (m,y,mo,d) => `${y}年${parseInt(mo)}月${parseInt(d)}日`) : '';

  let pe = '';
  pe += `<div style="text-align:center;margin-bottom:8px"><img src="${CLINIC_LOGO}" style="height:40px" alt="ミタス歯科クリニック"></div>`;
  pe += `<div class="pe-meta">
    <div><div class="pe-patient">${patientName ? esc(patientName) + ' 様' : '　　　　　　　　 様'}</div></div>
    <div class="pe-info-right">
      <div>作成日: <span>${dateStr || '　　年　　月　　日'}</span></div>
      <div>担当医: <span>${doctorName ? esc(doctorName) : '　　　　　　'}</span></div>
    </div></div>`;

  pe += `<div style="text-align:center;font-size:14px;font-weight:700;margin-bottom:10px;color:#019dc5">3プラン比較見積書</div>`;

  const allItemIds = new Map();
  PLANS.forEach(plan => {
    planItems[plan.id].forEach(item => {
      allItemIds.set(item.id, item.name);
    });
  });

  pe += '<table class="pe-compare-table">';
  pe += '<thead><tr><th style="text-align:left">内容</th>';
  PLANS.forEach(plan => {
    pe += `<th>${plan.icon} ${plan.label}</th>`;
  });
  pe += '</tr></thead><tbody>';

  allItemIds.forEach((name, id) => {
    pe += '<tr>';
    pe += `<td>${esc(name)}</td>`;
    PLANS.forEach(plan => {
      const item = planItems[plan.id].find(i => i.id === id);
      if (item) {
        pe += `<td>✓ ×${item.qty} (¥${fmt(item.price * item.qty)})</td>`;
      } else {
        pe += `<td style="color:#ccc">—</td>`;
      }
    });
    pe += '</tr>';
  });

  pe += '<tr class="compare-total"><td style="font-weight:700">合計（税込）</td>';
  PLANS.forEach(plan => {
    const { total } = getPlanTotal(plan.id);
    pe += `<td style="font-weight:700">¥${fmt(total)}</td>`;
  });
  pe += '</tr>';

  // 医療費控除行
  pe += '<tr><td style="font-weight:600;color:#166534">還付・軽減目安</td>';
  PLANS.forEach(plan => {
    const { total: pTotal } = getPlanTotal(plan.id);
    const pRefund = calcRefund(pTotal, otherMedical, insuranceReimbursement, annualIncome);
    if (pTotal > 0 && pRefund.totalRefund > 0) {
      pe += `<td style="color:#059669;font-weight:700">▲¥${fmt(pRefund.totalRefund)}</td>`;
    } else {
      pe += `<td style="color:#ccc">—</td>`;
    }
  });
  pe += '</tr>';

  pe += '<tr><td style="font-weight:600;color:#92400e">実質負担額</td>';
  PLANS.forEach(plan => {
    const { total: pTotal } = getPlanTotal(plan.id);
    const pRefund = calcRefund(pTotal, otherMedical, insuranceReimbursement, annualIncome);
    if (pTotal > 0 && pRefund.totalRefund > 0) {
      pe += `<td style="color:#92400e;font-weight:700">¥${fmt(pTotal - pRefund.totalRefund)}</td>`;
    } else {
      pe += `<td style="color:#ccc">—</td>`;
    }
  });
  pe += '</tr>';

  pe += '</tbody></table>';

  PLANS.forEach(plan => {
    if (planMemos[plan.id]) {
      pe += `<div><div class="pe-memo-label">${plan.label} 備考</div><div class="pe-memo">${esc(planMemos[plan.id]).replace(/\n/g,'<br>')}</div></div>`;
    }
  });

  pe += `<div class="pe-notes" style="margin-top:8px">※ 表示価格はすべて税込です。医療費控除は簡易シミュレーションであり、実際の還付額は年収等により異なります。<br>
    ※ 本見積は現時点での診断に基づいて作成しております。治療の進行状況やお口の状態の変化により、治療内容および費用が変更となる場合がございます。<br>
    ※ 追加処置が必要となった場合は別途費用が発生することがあります。</div>`;
  pe += `<div class="pe-footer"><div>有効期限: 発行日より3ヶ月</div><div style="text-align:right">ミタス歯科クリニック　TEL 048-822-8500</div></div>`;

  document.getElementById('print-estimate').innerHTML = pe;
}

render();

</script>
</body>
